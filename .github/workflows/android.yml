name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing material
        run: |
          test -f keystore.properties || { echo "::error::缺少 keystore.properties"; exit 1; }
          test -f keystore/getcookie.jks || { echo "::error::缺少 keystore/getcookie.jks"; exit 1; }
          echo "仓库内签名文件就绪"

      - name: Run unit tests
        run: ./gradlew test

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName="${VERSION_NAME}"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GetCookie-${VERSION_NAME}.apk"
          ls -l dist

      - name: Verify APK signature
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "dist/GetCookie-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GetCookie-${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: v${{ env.VERSION_NAME }}
          files: dist/*.apk
          generate_release_notes: true
